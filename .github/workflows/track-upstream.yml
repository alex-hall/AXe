name: Track upstream

# Keeps the serve-mode branch riding on upstream AXe's newest release without
# anyone doing it by hand: rebase the serve commits onto the newest stable
# upstream tag, push, and ship a `<tag>-serve.N` prerelease. A rebase that
# does not apply cleanly fails this workflow, which is the one moment a person
# is needed.
on:
  schedule:
    - cron: '17 9 * * 1' # Mondays 09:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  rebase-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: serve-mode
          fetch-depth: 0
          fetch-tags: true

      - name: Find upstream's newest stable tag
        id: upstream
        run: |
          git remote add upstream https://github.com/cameroncooke/AXe.git
          git fetch --tags upstream
          latest=$(git tag --list 'v*' --sort=-v:refname | grep -Ev -- '-' | head -1)
          [ -n "$latest" ] || { echo "no upstream v* tag found"; exit 1; }
          echo "tag=$latest" >> "$GITHUB_OUTPUT"
          echo "newest stable upstream tag: $latest"

      - name: Rebase serve-mode onto it
        id: rebase
        env:
          TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          base=$(git merge-base serve-mode upstream/main)
          if git merge-base --is-ancestor "$TAG" serve-mode; then
            echo "serve-mode already includes $TAG"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "rebasing $(git rev-list --count "$base"..serve-mode) serve commit(s) from $base onto $TAG"
            git rebase --onto "$TAG" "$base" serve-mode
            git push --force-with-lease origin serve-mode
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag and ship a serve prerelease when none exists for this base
        env:
          TAG: ${{ steps.upstream.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(git tag --list "${TAG}-serve.*" --sort=-v:refname | head -1)
          if [ -n "$existing" ] && [ "$(git rev-parse "$existing^{commit}")" = "$(git rev-parse serve-mode)" ]; then
            echo "$existing already points at serve-mode — nothing to ship"
            exit 0
          fi
          n=$(( $(git tag --list "${TAG}-serve.*" | wc -l) + 1 ))
          new="${TAG}-serve.${n}"
          git tag "$new" serve-mode
          git push origin "$new"
          echo "tagged $new; dispatching the release workflow (a token-pushed tag fires no push trigger)"
          gh workflow run release.yml -f tag="$new" -f publish=true
